[build]
  publish = "public"

# No build command — Times Quest is a static PWA with no dependencies.

# The service worker must never be cached by the browser or CDN.
# If it is, installed devices keep serving an old sw.js and never
# discover new versions of the game.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Content-Type = "application/manifest+json"
