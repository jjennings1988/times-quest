<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Times Quest camp animation QA</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;background:#15112b;color:#fff;font:700 14px/1.25 system-ui,sans-serif}
  header{position:sticky;top:0;z-index:2;padding:calc(12px + env(safe-area-inset-top)) 16px 12px;background:#1d1738e8;backdrop-filter:blur(10px)}
  h1{margin:0 0 4px;font-size:20px}.note{color:#c8c0df;font-size:12px;font-weight:600}
  main{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;padding:14px 14px calc(20px + env(safe-area-inset-bottom))}
  article{min-width:0;border:1px solid #655b82;border-radius:16px;background:linear-gradient(#97b8ab 0 56%,#594630 56%);overflow:hidden}
  .stage{position:relative;height:150px;background:linear-gradient(transparent 72%,#ffffff33 73%,transparent 75%)}
  .sprite{position:absolute;left:50%;bottom:13px;translate:-50% 0;width:min(138px,92%);aspect-ratio:var(--ratio,1);background-image:var(--art);background-size:300% 100%;background-repeat:no-repeat;animation:sprite3 var(--speed,.9s) steps(3) infinite}
  .wide{width:min(144px,96%)}
  .label{padding:8px 10px;background:#262040;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  @keyframes sprite3{from{background-position:0 0}to{background-position:150% 0}}
  @media (prefers-reduced-motion:reduce){.sprite{animation:none}}
</style>
</head>
<body>
<header><h1>Camp animation anchor check</h1><div class="note">The ground-contact point should remain fixed while each three-frame strip cycles.</div></header>
<main>
  <article><div class="stage"><div class="sprite wide" style="--art:url('../public/art/camp/camp-activity-kite-strip3.png');--ratio:2/1;--speed:2s"></div></div><div class="label">Kite stake</div></article>
  <article><div class="stage"><div class="sprite" style="--art:url('../public/art/camp/camp-banner-t1-strip3.png');--speed:1.3s"></div></div><div class="label">Pennant pole</div></article>
  <article><div class="stage"><div class="sprite" style="--art:url('../public/art/camp/camp-banner-t2-strip3.png');--speed:1.5s"></div></div><div class="label">Camp flag pole</div></article>
  <article><div class="stage"><div class="sprite wide" style="--art:url('../public/art/camp/camp-banner-t3-strip3.png');--ratio:2/1;--speed:1.8s"></div></div><div class="label">Summit banner poles</div></article>
  <article><div class="stage"><div class="sprite" style="--art:url('../public/art/camp/camp-fire-t2-strip3.png');--speed:.75s"></div></div><div class="label">Campfire ring</div></article>
  <article><div class="stage"><div class="sprite" style="--art:url('../public/art/camp/camp-fire-t3-strip3.png');--speed:.9s"></div></div><div class="label">Stone hearth</div></article>
  <article><div class="stage"><div class="sprite" style="--art:url('../public/art/camp/camp-fire-t4-strip3.png');--ratio:3/2;--speed:1.1s"></div></div><div class="label">Great bonfire ring</div></article>
  <article><div class="stage"><div class="sprite wide" style="--art:url('../public/art/camp/camp-light-t3-strip3.png');--ratio:2/1;--speed:2.4s"></div></div><div class="label">String-light posts</div></article>
  <article><div class="stage"><div class="sprite" style="--art:url('../public/art/camp/camp-water-t3-strip3.png');--speed:.6s"></div></div><div class="label">Pool masonry</div></article>
  <article><div class="stage"><div class="sprite" style="--art:url('../public/art/climber.png');--speed:2.8s"></div></div><div class="label">Climber boots</div></article>
</main>
</body>
</html>
